publish_to: "none"
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  table_core:
    path: ../../packages/table_core
  material_ui: ^1.2.0
