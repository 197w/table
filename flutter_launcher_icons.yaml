# Ikona aplikacji generowana z plików w assets/icon.
# Pliki PNG tworzy: node tool/generate_icon_png.js
# Ikony platform tworzy: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#559C84"
  min_sdk_android: 24
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  # Znak jest już przeskalowany do strefy bezpiecznej, więc bez dodatkowego odstępu.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
