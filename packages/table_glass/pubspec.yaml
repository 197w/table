name: table_glass
description: "Natywne przyciski Liquid Glass (iOS 26) nad widokiem Fluttera dla Table i Table for employees."
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: TableGlassPlugin
